name: Version checker

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run version checker
        env:
          GITHUB_TOKEN: ${{secrets.VERSION_TOKEN}}
        
        run: node version-checker.js