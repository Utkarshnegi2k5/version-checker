name: Version checker

on:
  push:
    branches:
      - main

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run version checker
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        
        run: node version-checker.js