name: Version checker

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run version checker
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        
        run: node version-checker.js